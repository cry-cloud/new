<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f63e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CRY">
<title>CRY · 数学工作台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#f5f6fa;--ink:#1a1b20;--ink2:#63657a;--ink3:#9b9dae;
--line:#e9eaf0;--line2:#d9dbe4;--brand:#4f63e8;--brand2:#3a4dd0;
--soft:#eef0fe;--danger:#cc3f4b;
--fs:"Times New Roman","Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
--fm:"Times New Roman","Latin Modern Math","STIX Two Math","Cambria Math",serif;
--fc:"SF Mono",Consolas,"Courier New",monospace;
--safeb:env(safe-area-inset-bottom,0px);
--safeh:env(safe-area-inset-top,0px);
}
html,body{height:100%}
body{font-family:var(--fs);background:var(--bg);color:var(--ink);height:100vh;height:100dvh;overflow:hidden;
font-size:15px;letter-spacing:.02em;-webkit-font-smoothing:antialiased;
padding-top:var(--safeh);padding-bottom:var(--safeb);box-sizing:border-box}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbcdda;border-radius:4px;border:2px solid transparent;background-clip:content-box}
button,input,textarea,select{font-family:inherit;font-size:inherit;-webkit-appearance:none;appearance:none}

/* 数学公式排版 */
.mt{display:inline-block;vertical-align:middle;font-family:var(--fm);line-height:1.25;white-space:nowrap}
.mt-disp{display:block;text-align:center;margin:12px 0;white-space:normal}
.mt sub{font-size:.7em;vertical-align:-.22em;line-height:1}
.mt sup{font-size:.7em;vertical-align:.45em;line-height:1}
.mt-frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.1}
.mt-num{border-bottom:1.2px solid currentColor;padding:0 .3em}
.mt-den{padding:0 .3em}
.mt-sqrt{display:inline-flex;align-items:flex-start;vertical-align:middle;margin:0 .1em;position:relative}
.mt-rad{font-size:1.1em;line-height:1;transform:translateY(-.02em)}
.mt-radicand{border-top:1.2px solid currentColor;padding:.08em .3em 0;margin-left:-.12em}
.mt-root{position:absolute;top:-.32em;left:-.08em;font-size:.6em;font-weight:600}
.mt-bigop{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .1em;line-height:1}
.mt-bigop-sym{font-size:1.5em;line-height:1;padding:.02em 0}
.mt-bigsup,.mt-bigsub{font-size:.66em;line-height:1.15;padding:0 .1em}
.mt-bigsup{order:0}.mt-bigop-sym{order:1}.mt-bigsub{order:2}
.mt-limo{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1}
.mt-limo .mt-limname{font-size:1.05em;line-height:1;font-family:var(--fs)}
.mt-limo .mt-limsub{font-size:.68em;padding-top:.05em}
.mt-matrix{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .15em}
.mt-mleft,.mt-mright{font-size:2.1em;line-height:1;font-weight:300;font-family:var(--fm);padding:0 .05em;transform:scaleY(1.2);display:inline-block}
.mt-mtable{border-collapse:collapse;margin:0 .1em}
.mt-mtable td{padding:2px 7px;text-align:center;font-size:.95em}
.mt-cases{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .15em}
.mt-cases-body{display:flex;flex-direction:column}
.mt-case-row{padding:1.5px 0;font-size:.95em;text-align:left}
.mt-thin{display:inline-block;width:.2em}
.mt-op{font-style:normal;padding:0 .15em;font-family:var(--fs)}
.mt-text{font-family:var(--fs);font-style:normal}
.mt-err{color:var(--danger);font-family:var(--fc);padding:1px 6px;border:1px dashed var(--danger);border-radius:4px;font-size:.85em}
.eq-block{display:flex;align-items:center;gap:16px;margin:14px 0}
.eq-block .eq-body{flex:1;text-align:center}
.eq-block .eq-tag{font-family:var(--fc);color:var(--ink2);font-size:14px;letter-spacing:.04em;min-width:40px;text-align:right}

/* 分类选择器 */
.cpicker{position:relative;width:100%}
.cpicker input{width:100%;border:1px solid var(--line2);border-radius:11px;padding:11px 32px 11px 13px;
font-size:15px;outline:none;background:#fafbfe;transition:.15s;color:var(--ink)}
.cpicker input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--soft)}
.cpicker .cp-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;
border:1px solid var(--line2);border-radius:11px;box-shadow:0 12px 32px rgba(20,22,42,.16);
max-height:240px;overflow-y:auto;z-index:200;display:none;padding:5px}
.cpicker .cp-drop.open{display:block}
.cpicker .cp-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;
color:var(--ink);transition:.12s;display:flex;align-items:center;gap:8px}
.cpicker .cp-item:hover{background:var(--soft);color:var(--brand)}
.cpicker .cp-item.active{background:var(--soft);color:var(--brand);font-weight:600}
.cpicker .cp-item .cp-path{flex:1;overflow:hidden;text-overflow:ellipsis}
.cpicker .cp-item .cp-cnt{font-size:11.5px;color:var(--ink3)}
.cpicker .cp-item.cp-new{color:var(--brand);font-weight:600}
.cpicker .cp-item.cp-new::before{content:"＋";font-size:15px}
.cpicker .cp-empty{padding:14px;text-align:center;color:var(--ink3);font-size:13px}

/* 登录 */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#eef0fe 0%,#f5f6fa 50%,#fef1ea 100%);z-index:500;padding:20px}
.login-card{background:#fff;border-radius:22px;padding:38px 36px;width:400px;max-width:100%;
box-shadow:0 24px 70px rgba(20,22,42,.13)}
.login-logo{font-size:38px;font-weight:800;letter-spacing:.35em;font-style:italic;
text-align:center;background:linear-gradient(128deg,#4f63e8,#7c5cf0 55%,#d96f4a);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
.login-sub{text-align:center;color:var(--ink3);font-size:12px;letter-spacing:.28em;margin-bottom:22px;font-style:italic}
.login-tab{display:flex;gap:3px;background:#eff0f7;padding:3px;border-radius:10px;margin-bottom:20px}
.login-tab button{flex:1;border:none;background:transparent;padding:10px;border-radius:8px;font-size:14.5px;
color:var(--ink2);cursor:pointer;transition:.16s}
.login-tab button.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 1px 4px rgba(20,22,42,.1)}
.login-field{margin-bottom:13px}
.login-field label{display:block;font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.login-field input{width:100%;padding:12px 14px;border:1.5px solid var(--line2);border-radius:11px;
font-size:15px;outline:none;background:#fafbfe;transition:.15s}
.login-field input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--soft)}
.login-remember{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.login-remember input{width:18px;height:18px;cursor:pointer;accent-color:var(--brand)}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,#4f63e8,#7c5cf0);color:#fff;
border:none;border-radius:11px;font-size:15.5px;font-weight:600;letter-spacing:.22em;cursor:pointer;margin-top:10px;transition:.18s}
.login-btn:hover{box-shadow:0 8px 24px rgba(79,99,232,.35)}
.login-tip{text-align:center;font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.9}
.login-tip code{background:#f0f1f7;padding:2px 7px;border-radius:5px;font-family:var(--fc);font-size:11.5px}

/* 顶栏 */
.header{height:58px;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(14px);
-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:14px;padding:0 16px;position:relative;z-index:20;flex-shrink:0}
.menu-btn{display:none;width:40px;height:40px;border:none;background:transparent;border-radius:9px;
cursor:pointer;font-size:20px;color:var(--ink);align-items:center;justify-content:center}
.menu-btn:hover{background:var(--soft)}
.brand{font-size:20px;font-weight:800;letter-spacing:.3em;font-style:italic;
background:linear-gradient(128deg,#4f63e8,#7c5cf0 55%,#d96f4a);-webkit-background-clip:text;
background-clip:text;-webkit-text-fill-color:transparent;user-select:none}
.tabs{display:flex;gap:3px;background:#eff0f7;padding:4px;border-radius:11px}
.tab-btn{border:none;background:transparent;padding:8px 22px;border-radius:9px;font-size:14.5px;
font-weight:500;color:var(--ink2);cursor:pointer;transition:.18s;letter-spacing:.12em}
.tab-btn:hover{color:var(--ink)}
.tab-btn.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 1px 5px rgba(20,22,42,.1)}
.hr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#f0f1f7;border-radius:20px;
font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;color:var(--ink)}
.user-chip:hover{background:var(--soft);color:var(--brand)}
.user-chip .ava{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#4f63e8,#7c5cf0);
display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}

/* 按钮 */
.btn{border:1px solid var(--line2);background:#fff;padding:8px 15px;border-radius:9px;font-size:14px;
cursor:pointer;transition:.16s;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;
justify-content:center;gap:6px}
.btn:hover{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand2);border-color:var(--brand2)}
.btn.dan{color:var(--danger);border-color:#eec6ca}
.btn.dan:hover{background:#fdf2f3;border-color:#e08288}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.gh{border-color:transparent;background:transparent}
.btn.gh:hover{background:var(--soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.main{height:calc(100% - 58px);display:flex;flex-direction:column;position:relative}
.panel{display:none;height:100%}
.panel.on{display:flex}
.sep{width:1px;height:22px;background:var(--line2);margin:0 5px;flex-shrink:0}
.vis-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:4px 10px;border-radius:11px;
font-weight:600;cursor:pointer;user-select:none;transition:.15s;border:none}
.vis-badge.priv{background:#f0f1f7;color:var(--ink3)}
.vis-badge.pub{background:#e8f5e9;color:#2e7d32}

/* 侧栏 */
.side{width:280px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.side-tabs{display:flex;gap:2px;padding:8px;border-bottom:1px solid var(--line);background:#fafbfe;flex-shrink:0}
.side-tabs button{flex:1;border:none;background:transparent;padding:8px 4px;border-radius:7px;font-size:12.5px;
cursor:pointer;color:var(--ink2);transition:.15s}
.side-tabs button.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 1px 3px rgba(20,22,42,.08);border:1px solid var(--line)}
.side-panes{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.side-pane{display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0}
.side-pane.on{display:flex}
.side-head{padding:11px;border-bottom:1px solid var(--line);flex-shrink:0}
.side-head select{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;font-size:14px;
background:#fafbfe;cursor:pointer;color:var(--ink);outline:none}
.side-head select:focus{border-color:var(--brand);background:#fff}
.sym-grid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-content:start}
.sym-grid button{aspect-ratio:1;border:1px solid transparent;background:#f7f8fc;border-radius:8px;font-size:18px;
cursor:pointer;transition:.12s;display:flex;align-items:center;justify-content:center;padding:0;
font-family:var(--fm);color:var(--ink);line-height:1}
.sym-grid button:hover,.sym-grid button:active{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.side-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.side-foot .btn{flex:1;justify-content:center;font-size:12.5px;padding:6px 8px}

/* 大纲 */
.outline-tree{flex:1;overflow-y:auto;padding:10px 8px}
.ol-item{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;line-height:1.5;
display:flex;align-items:flex-start;gap:6px;transition:.13s;color:var(--ink2);margin-bottom:2px}
.ol-item:hover,.ol-item:active{background:var(--soft);color:var(--brand)}
.ol-item .ol-icon{flex-shrink:0;font-size:11px;opacity:.7;margin-top:2px;font-family:var(--fc)}
.ol-item .ol-label{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ol-empty{text-align:center;color:var(--ink3);padding:30px 12px;font-size:13px;line-height:1.9}

/* 分类树 */
.note-cat-head{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:5px;flex-shrink:0}
.note-cat-head .btn{flex:1;justify-content:center;font-size:12.5px;padding:6px 8px}
.note-tree{max-height:220px;overflow-y:auto;padding:8px;border-bottom:1px solid var(--line);flex-shrink:0}
.tree-node{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;display:flex;
align-items:center;gap:6px;transition:.14s;color:var(--ink);user-select:none;margin-bottom:2px;border:1.5px dashed transparent}
.tree-node:hover{background:#f6f7fc}
.tree-node.active{background:var(--soft);color:var(--brand);font-weight:600}
.tree-node.active .cnt{background:var(--brand);color:#fff}
.tree-node.drag-target{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.tree-node .ico{font-size:10.5px;color:var(--ink3);transition:.14s;flex-shrink:0;width:12px;display:inline-block}
.tree-node.open .ico{transform:rotate(90deg)}
.tree-node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-node .cnt{font-size:10.5px;background:#f0f1f7;color:var(--ink3);padding:1px 6px;border-radius:9px;font-weight:600;flex-shrink:0}
.tree-children{padding-left:12px}
.tree-node.lv2{padding-left:8px}.tree-node.lv3{padding-left:22px;font-size:13px}.tree-node.lv4{padding-left:34px;font-size:12.5px}

.note-list-header{padding:8px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap;flex-shrink:0}
.note-list-header .title{font-weight:600;color:var(--ink2);font-size:12.5px;cursor:pointer;
padding:4px 8px;border-radius:6px;transition:.13s;display:inline-flex;align-items:center;gap:4px}
.note-list-header .title:hover{background:var(--soft);color:var(--brand)}
.note-list-header .acts{display:none;gap:5px;align-items:center;margin-left:auto}
.note-list-header .acts.on{display:flex}
.note-list-header .acts .btn{padding:4px 8px;font-size:11.5px}
#noteSelCount{font-size:11.5px;color:var(--brand);font-weight:700}
.note-list{flex:1;overflow-y:auto;padding:6px}
.note-item{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px;display:flex;
align-items:flex-start;gap:8px;transition:.13s;border:1.5px solid transparent}
.note-item:hover{background:#f6f7fc}
.note-item.active{background:var(--soft);border-color:#dbe0fc}
.note-item.active .ti{color:var(--brand)}
.note-item .cb{width:16px;height:16px;border:1.5px solid #c8cad6;border-radius:4px;flex-shrink:0;
background:#fff;margin-top:2px;display:none;align-items:center;justify-content:center}
.note-item.selmode{cursor:pointer}
.note-item.selmode .cb{display:flex}
.note-item.sel{background:var(--soft);border-color:var(--brand)}
.note-item.sel .cb{background:var(--brand);border-color:var(--brand)}
.note-item.sel .cb::after{content:"✓";color:#fff;font-size:11px;font-weight:700;line-height:1}
.note-item .tt{flex:1;overflow:hidden;min-width:0}
.note-item .ti{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
.note-item .tm{font-size:10.5px;color:var(--ink3);margin-top:3px}
.empty-note{text-align:center;color:var(--ink3);padding:24px 10px;font-size:12.5px;line-height:1.9}

.note-main{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{background:#fff;border-bottom:1px solid var(--line);padding:7px 12px;display:flex;gap:3px;
flex-wrap:wrap;align-items:center;row-gap:4px;flex-shrink:0}
.toolbar select{padding:6px 9px;border:1px solid transparent;border-radius:8px;font-size:13.5px;
background:transparent;cursor:pointer;color:var(--ink);outline:none}
.toolbar select:hover{background:#f2f3f9}
.tb-btn{border:1px solid transparent;background:transparent;min-width:34px;height:32px;padding:0 6px;border-radius:8px;
cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;transition:.13s;color:var(--ink);font-weight:600}
.tb-btn:hover,.tb-btn:active{background:#f2f3f9}
.tb-btn.on{background:var(--soft);color:var(--brand)}
.tb-btn.hl{color:var(--brand)}
.tb-btn.box-btn{font-size:12.5px;padding:0 8px;min-width:38px}
.tb-btn.box-btn[data-box="prob"]{color:#3a4dd0;background:#eef2ff}
.tb-btn.box-btn[data-box="sln"]{color:#2e7d32;background:#f2fbf4}
.tb-btn.box-btn[data-box="rmk"]{color:#6b6d78;background:#f6f7fa}
.tb-btn.box-btn[data-box="ref"]{color:#5c5f70;background:#f8f9fb}
.cat-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:8px;
border:1px solid var(--line2);background:#fff;cursor:pointer;font-size:13px;color:var(--ink);
transition:.15s;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-btn:hover{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.paper-wrap{flex:1;overflow-y:auto;background:#fff;-webkit-overflow-scrolling:touch}
.paper{width:100%;min-height:100%;background:#fff;padding:clamp(20px,3vw,48px) clamp(20px,5vw,90px) 0;counter-reset:h1 h2 h3}
.paper-title{border:none;outline:none;font-family:var(--fs);font-size:30px;font-weight:700;width:100%;
color:var(--ink);letter-spacing:.03em;line-height:1.5;padding-bottom:16px;margin-bottom:14px;
border-bottom:1px solid var(--line);background:transparent}
.paper-title::placeholder{color:#cccedb;font-weight:400;font-style:italic}
.paper-body{border:none;outline:none;font-family:var(--fs);font-size:17.5px;line-height:2.05;color:var(--ink);
min-height:calc(100dvh - 260px);word-wrap:break-word;padding-bottom:140px}
.paper-body:empty::before{content:"开始记录…  输入 / 唤出快捷命令";color:#c6c8d6;font-style:italic;pointer-events:none}
.paper-body img{vertical-align:middle;max-width:100%}
.paper-body p,.paper-body div{margin:0 0 .55em 0}
.paper-body h1{font-size:24px;font-weight:700;margin:1.3em 0 .6em;counter-increment:h1;counter-reset:h2 h3}
.paper-body h1::before{content:counter(h1) " ";color:var(--brand);margin-right:.3em}
.paper-body h2{font-size:20px;font-weight:700;margin:1.2em 0 .55em;counter-increment:h2;counter-reset:h3}
.paper-body h2::before{content:counter(h1) "." counter(h2) " ";color:var(--brand);margin-right:.3em}
.paper-body h3{font-size:17.5px;font-weight:700;margin:1em 0 .45em;counter-increment:h3}
.paper-body h3::before{content:counter(h1) "." counter(h2) "." counter(h3) " ";color:var(--brand);margin-right:.3em}
.paper-body blockquote{border-left:3px solid var(--line2);padding-left:18px;color:var(--ink2);margin:.9em 0;font-style:italic}
.paper-body ul,.paper-body ol{padding-left:28px;margin:.55em 0}
.paper-body hr{border:none;border-top:1px solid var(--line2);margin:1.6em 0}
.paper-body a{color:var(--brand);text-decoration:none;border-bottom:1px dotted var(--brand)}
.mbox{border-radius:10px;padding:15px 20px;margin:15px 0;position:relative;border:1px solid var(--line2);background:#fcfcfe}
.mbox::before{position:absolute;top:-11px;left:16px;background:#fff;padding:0 10px;font-size:12.5px;font-weight:700;letter-spacing:.24em}
.mbox.def{border-color:#c8d4f5;background:linear-gradient(180deg,#f2f5ff 0%,#fafbff 100%)}.mbox.def::before{content:"定 义";color:#3a4dd0}
.mbox.thm{border-color:#c3caf7;background:linear-gradient(180deg,#f3f5ff 0%,#fbfcff 100%)}.mbox.thm::before{content:"定 理";color:#4f63e8}
.mbox.lem{border-color:#d8c8f5;background:linear-gradient(180deg,#f6f1fe 0%,#fbf9ff 100%)}.mbox.lem::before{content:"引 理";color:#7c5cf0}
.mbox.cor{border-color:#c8e0f5;background:linear-gradient(180deg,#f0f7fe 0%,#fafdff 100%)}.mbox.cor::before{content:"推 论";color:#3a7dd0}
.mbox.ex{border-color:#c8e5cf;background:linear-gradient(180deg,#f2fbf4 0%,#fbfefc 100%)}.mbox.ex::before{content:"例";color:#2e7d32}
.mbox.sol{border-color:#c5e5e8;background:linear-gradient(180deg,#f0fafa 0%,#fafeff 100%)}.mbox.sol::before{content:"解";color:#0e7490}
.mbox.prf{border-color:#d5d7e2;background:linear-gradient(180deg,#f6f7fa 0%,#fcfcfd 100%)}.mbox.prf::before{content:"证 明";color:#6b6d78}
.mbox.note{border-color:#f5d8b8;background:linear-gradient(180deg,#fef8f1 0%,#fffdfa 100%)}.mbox.note::before{content:"注 意";color:#c2752a}
.mbox.sum{border-color:#f5c8dc;background:linear-gradient(180deg,#fef4f9 0%,#fffbfd 100%)}.mbox.sum::before{content:"小 结";color:#c73d80}
.mbox.prob{border:1.5px solid #c3caf7;background:linear-gradient(180deg,#eef2ff 0%,#f9fbff 100%)}
.mbox.prob::before{content:"Problem";color:#3a4dd0;font-family:var(--fc);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase}
.mbox.sln{border:1.5px solid #c8e5cf;background:linear-gradient(180deg,#f2fbf4 0%,#fbfefc 100%)}
.mbox.sln::before{content:"Solution";color:#2e7d32;font-family:var(--fc);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase}
.mbox.rmk{border:none;border-left:3px solid #b0b3c0;background:#f8f9fb;border-radius:0 8px 8px 0;padding:12px 18px}
.mbox.rmk::before{content:"Remark";color:#6b6d78;font-family:var(--fc);font-size:11.5px;letter-spacing:.2em;font-style:italic;top:-9px;left:12px}
.mbox.ref{border:1px dashed #d0d3dc;background:#fafbfc;padding:10px 16px;font-size:13.5px;font-family:var(--fc);color:#5c5f70}
.mbox.ref::before{content:"Source";color:#8b8e9c;font-family:var(--fc);font-size:11px;letter-spacing:.2em}
.mbox.ctr{text-align:center}
.mbox.ctr .mt{display:block;text-align:center}
.status{padding:7px 22px;font-size:13px;color:var(--ink3);border-top:1px solid var(--line);background:#fff;display:flex;gap:18px;flex-shrink:0}

/* 便签 */
#p-memo{flex-direction:row}
.memo-cats{width:280px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.memo-cats-head{padding:11px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-shrink:0}
.memo-cats-head .btn{flex:1;justify-content:center;font-size:12.5px}
.memo-tree{flex:1;overflow-y:auto;padding:8px}
.memo-main{flex:1;display:flex;flex-direction:column;min-width:0}
.memo-toolbar{background:#fff;border-bottom:1px solid var(--line);padding:11px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
#selActs{display:none;gap:7px;align-items:center}
#selActs.on{display:flex}
.memo-body{flex:1;overflow-y:auto;padding:16px 18px;-webkit-overflow-scrolling:touch}
.memo-list{display:flex;flex-direction:column;gap:8px;max-width:1400px;margin:0 auto}
.mcard{background:#fff;border-radius:10px;padding:14px 16px 14px 18px;box-shadow:0 1px 2px rgba(20,22,42,.04);
border:1.5px solid var(--line);cursor:grab;position:relative;transition:.16s;display:flex;align-items:flex-start;
gap:12px;border-left:3px solid var(--brand)}
.mcard:hover{box-shadow:0 4px 16px rgba(20,22,42,.09);border-color:#d3d8f9}
.mcard.drg{opacity:.35}
.mcard.ov{border-color:var(--brand);background:var(--soft)}
.mcard .sel-box{flex-shrink:0;width:22px;height:22px;border:2px solid #c8cad6;border-radius:6px;background:#fff;
margin-top:2px;display:none;align-items:center;justify-content:center}
.mcard.selmode{cursor:pointer}
.mcard.selmode .sel-box{display:flex}
.mcard.sel{border-color:var(--brand);background:var(--soft)}
.mcard.sel .sel-box{background:var(--brand);border-color:var(--brand)}
.mcard.sel .sel-box::after{content:"✓";color:#fff;font-size:13px;font-weight:700}
.mcard.selmode .acts{display:none}
.mcard .idx{flex-shrink:0;width:34px;height:26px;border-radius:7px;background:linear-gradient(135deg,#eef0fe,#e2e6fb);
color:var(--brand);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
font-family:var(--fc);margin-top:1px}
.mcard.sel .idx{background:var(--brand);color:#fff}
.mcard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mcard .src{font-size:12.5px;color:var(--ink3);font-style:italic;line-height:1.5;display:flex;align-items:center;gap:5px}
.mcard .src::before{content:"——";flex-shrink:0}
.mcard .txt{font-size:15.5px;line-height:1.85;word-break:break-word;white-space:pre-wrap;color:var(--ink)}
.mcard .side-r{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:70px}
.cat-tag{font-size:11px;background:var(--soft);color:var(--brand);padding:3px 10px;border-radius:20px;
font-weight:600;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cat-tag:hover{background:var(--brand);color:#fff}
.mcard .acts{display:flex;gap:3px;opacity:0;transition:opacity .16s}
.mcard:hover .acts,.mcard:active .acts{opacity:1}
.mcard .acts button{border:none;background:#f2f3f9;width:28px;height:28px;border-radius:7px;cursor:pointer;
font-size:13px;transition:.13s;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink2)}
.mcard .acts button:hover,.mcard .acts button:active{background:var(--soft);color:var(--brand)}
.mcard .acts button[data-a=del]:hover{background:#fdf2f3;color:var(--danger)}
.empty{text-align:center;color:var(--ink3);padding:90px 20px;font-size:15px;line-height:2}
.empty .big{font-size:40px;display:block;margin-bottom:12px;opacity:.42}

/* 随笔 */
#p-essay{flex-direction:row}
.essay-list{width:280px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.essay-list-head{padding:11px;border-bottom:1px solid var(--line);display:flex;gap:7px;flex-shrink:0}
.essay-list-head .btn{flex:1;justify-content:center;font-size:12.5px}
.essay-items{flex:1;overflow-y:auto;padding:8px}
.eitem{padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:3px;transition:.14s;border:1px solid transparent}
.eitem:hover{background:#f6f7fc}
.eitem.active{background:var(--soft);border-color:#dbe0fc}
.eitem .t{font-size:15px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eitem.active .t{color:var(--brand)}
.eitem .d{font-size:12px;color:var(--ink3)}
.essay-main{flex:1;display:flex;flex-direction:column;min-width:0}
.mode-sw{display:flex;gap:3px;background:#eff0f7;padding:3px;border-radius:9px;margin-right:6px}
.mode-sw button{border:none;background:transparent;padding:6px 18px;border-radius:7px;font-size:13.5px;
cursor:pointer;color:var(--ink2);transition:.16s}
.mode-sw button.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 1px 4px rgba(20,22,42,.1)}
.essay-wrap{flex:1;overflow-y:auto;background:#fff;-webkit-overflow-scrolling:touch}
.essay-paper{width:100%;min-height:100%;background:#fff;padding:clamp(20px,3vw,48px) clamp(20px,5vw,90px) 0}
.essay-title{border:none;outline:none;font-family:var(--fs);font-size:28px;font-weight:700;width:100%;
color:var(--ink);padding-bottom:16px;margin-bottom:14px;border-bottom:1px solid var(--line);background:transparent}
.essay-title::placeholder{color:#cccedb;font-weight:400;font-style:italic}
.essay-body{border:none;outline:none;font-family:var(--fs);font-size:17.5px;color:var(--ink);
min-height:calc(100dvh - 280px);word-wrap:break-word;padding-bottom:140px}
.essay-body:empty::before{color:#c6c8d6;font-style:italic;pointer-events:none}
.essay-body.mo-a{line-height:2.1}
.essay-body.mo-a>div,.essay-body.mo-a>p{text-indent:2em;margin:0 0 .68em 0;line-height:2.1}
.essay-body.mo-a>div:empty{min-height:1em}
.essay-body.mo-p{line-height:2.15;font-size:18.5px}
.essay-body.mo-p>div,.essay-body.mo-p>p{text-indent:0;margin:0;min-height:1.15em;line-height:2.15}

/* 广场 */
#p-square{flex-direction:column;background:linear-gradient(180deg,#f8f9fd,#f3f4fa)}
.square-header{padding:24px 32px 18px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
.square-title{font-size:24px;font-weight:700;margin-bottom:6px;
background:linear-gradient(128deg,#4f63e8,#7c5cf0 70%,#d96f4a);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.square-sub{font-size:13px;color:var(--ink3)}
.square-body{flex:1;overflow-y:auto;padding:22px 32px;-webkit-overflow-scrolling:touch}
.square-tabs{display:flex;gap:4px;margin-bottom:18px;background:#eef0f7;padding:4px;border-radius:11px;width:fit-content}
.square-tabs button{border:none;background:transparent;padding:8px 20px;border-radius:8px;font-size:14px;
cursor:pointer;color:var(--ink2);transition:.16s}
.square-tabs button.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 1px 4px rgba(20,22,42,.1)}
.square-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.scard{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 1px 3px rgba(20,22,42,.06);
border:1px solid var(--line);transition:.16s;cursor:pointer;position:relative}
.scard:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(20,22,42,.1);border-color:#d3d8f9}
.scard .st{font-size:15.5px;font-weight:700;margin-bottom:8px;padding-right:24px}
.scard .sd{font-size:13px;color:var(--ink3);margin-bottom:12px}
.scard .sb{font-size:14px;line-height:1.85;color:var(--ink2);max-height:5.4em;overflow:hidden}
.scard .smeta{font-size:11.5px;color:var(--ink3);margin-top:12px;padding-top:10px;
border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center}
.scard .stag{font-size:10.5px;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--brand);font-weight:600}
.viewer{width:100%;max-height:70vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;
padding:22px 26px;background:#fff}
.viewer .v-title{font-size:24px;font-weight:700;line-height:1.5;padding-bottom:14px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.viewer .v-meta{font-size:12.5px;color:var(--ink3);margin-bottom:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.viewer .v-body{font-size:16.5px;line-height:2.05;color:var(--ink);word-wrap:break-word}
.viewer .v-body img{vertical-align:middle;max-width:100%}
.viewer .v-body .mbox{border-radius:9px;padding:13px 18px;margin:13px 0;border:1px solid var(--line2)}
.viewer .v-memo-src{display:block;font-size:13px;color:var(--ink3);font-style:italic;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.viewer .v-memo-txt{white-space:pre-wrap;font-size:16.5px;line-height:2}

/* 弹窗 */
.mmask{position:fixed;inset:0;background:rgba(18,20,38,.42);backdrop-filter:blur(3px);
-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.mmask.on{display:flex}
.dlg{background:#fff;border-radius:16px;padding:24px;width:520px;max-width:100%;max-height:92vh;
overflow-y:auto;box-shadow:0 16px 50px rgba(20,22,42,.2);-webkit-overflow-scrolling:touch}
.dlg.wide{width:min(1240px,96vw);padding:18px}
.dlg.viewer-dlg{width:min(900px,94vw);padding:22px}
.dlg h3{font-size:18px;font-weight:700;margin-bottom:16px}
.dlg textarea,.dlg input[type=text]:not(.cp-input),.dlg input[type=password],.dlg input[type=file]{
width:100%;border:1px solid var(--line2);border-radius:11px;padding:12px 13px;font-size:15px;
outline:none;resize:vertical;transition:.15s;line-height:1.7;color:var(--ink);background:#fafbfe}
.dlg textarea{min-height:120px}
.dlg textarea:focus,.dlg input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--soft)}
.dlg .hint{font-size:12.5px;color:var(--ink3);line-height:1.85;margin-top:7px}
.dlg .hint code{background:#f0f1f7;padding:1px 6px;border-radius:4px;font-family:var(--fc);font-size:11.5px}
.dlg .hint.warn{background:#fff8ec;border:1px solid #f5d8b8;color:#a0641a;padding:10px 12px;border-radius:9px}
.dlg .hint.tip{background:#f0f9ff;border:1px solid #c5e5e8;color:#0e7490;padding:10px 12px;border-radius:9px}
.dlg .row{margin-bottom:12px}
.dlg .row label{display:block;font-size:13.5px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.acts{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;flex-wrap:wrap}
#ggbBox{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;margin-bottom:14px;min-height:400px;position:relative}
.ggb-load{display:flex;align-items:center;justify-content:center;height:420px;color:var(--ink3);
font-size:15px;gap:14px;flex-direction:column}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:calc(30px + var(--safeb));left:50%;transform:translateX(-50%) translateY(20px);
background:rgba(24,26,44,.95);color:#fff;padding:12px 22px;border-radius:11px;font-size:14px;
opacity:0;transition:.26s;z-index:300;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.26);
max-width:90vw;display:flex;align-items:center;gap:12px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;padding:4px 12px;
border-radius:6px;cursor:pointer;font-size:13px}
.fmlib{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-height:min(500px,70vh);overflow-y:auto;padding:2px}
.fmitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fafbfe;transition:.15s;text-align:center;overflow:hidden}
.fmitem:hover{border-color:var(--brand);background:var(--soft)}
.fmitem .nm{font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.fmitem .pv{min-height:32px;max-height:80px;display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden}
.fb-type-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.fb-type-row button{border:1.5px solid var(--line2);background:#fff;padding:8px 13px;border-radius:9px;
cursor:pointer;font-size:13.5px;color:var(--ink2);transition:.15s}
.fb-type-row button.on{border-color:var(--brand);background:var(--brand);color:#fff;font-weight:600}
.fb-preview{padding:16px 14px;background:#fafbfe;border:1px solid var(--line);border-radius:10px;
text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;font-family:var(--fm);overflow:auto}
.fb-tex{font-family:var(--fc);font-size:12px;color:var(--ink3);margin-top:8px;padding:8px 11px;background:#f7f8fc;border-radius:8px;word-break:break-all;line-height:1.7}
.fb-inputs{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.fb-inputs .row{margin:0}
.fb-inputs .row.full{grid-column:1/-1}

/* 便签导入对话框 · 实时预览 */
.import-mode-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;
  padding:10px 14px;background:#fafbfe;border:1px solid var(--line);border-radius:10px}
.imr-label{font-size:13px;color:var(--ink2);font-weight:600}
.imr-opt{display:flex;align-items:center;gap:5px;font-size:13.5px;color:var(--ink);cursor:pointer;
  padding:6px 12px;border-radius:7px;transition:.13s;user-select:none}
.imr-opt:hover,.imr-opt:active{background:var(--soft);color:var(--brand)}
.imr-opt input{cursor:pointer;accent-color:var(--brand);width:16px;height:16px}
.preview-header{display:flex;align-items:center;justify-content:space-between;
  margin:14px 0 6px;padding:0 2px;font-size:13px;font-weight:600;color:var(--ink2)}
.preview-box{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;
  background:#fff;padding:4px;-webkit-overflow-scrolling:touch}
.pv-empty{padding:36px 16px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.9}
.pv-item{display:flex;gap:10px;padding:9px 10px;border-radius:7px}
.pv-item+.pv-item{border-top:1px dashed #f0f1f6}
.pv-idx{flex-shrink:0;color:var(--ink3);font-family:var(--fc);font-size:12px;
  padding-top:3px;width:34px;text-align:right}
.pv-body{flex:1;min-width:0}
.pv-src{font-size:11.5px;color:var(--ink3);font-style:italic;margin-bottom:2px}
.pv-txt{font-size:14px;line-height:1.65;color:var(--ink);word-break:break-word}
.pv-more{padding:10px 14px;text-align:center;color:var(--ink3);font-size:12.5px;border-top:1px dashed #f0f1f6;margin-top:4px}

/* 矩阵构造器 */
.matrix-wrap{background:#fafbfe;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.matrix-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.matrix-toolbar label{font-size:13px;color:var(--ink2);font-weight:600}
.matrix-toolbar input[type=number]{width:52px;padding:6px 7px;border:1px solid var(--line2);border-radius:7px;
font-size:13.5px;outline:none;text-align:center;background:#fff}
.delim-group{display:flex;gap:2px;background:#eff0f7;padding:3px;border-radius:8px}
.delim-group button{border:none;background:transparent;padding:5px 11px;border-radius:6px;cursor:pointer;
font-size:13.5px;color:var(--ink2);transition:.15s;font-weight:600}
.delim-group button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(20,22,42,.1)}
.matrix-box{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px 10px;
background:#fff;border-radius:9px;border:1px solid var(--line);overflow-x:auto}
.matrix-delim{font-family:var(--fm);font-size:60px;color:var(--brand);line-height:.75;font-weight:300}
.matrix-grid{display:grid;gap:6px}
.matrix-grid input{width:56px;height:38px;border:1.5px solid var(--line2);border-radius:7px;padding:4px 6px;
font-size:14px;text-align:center;outline:none;font-family:var(--fm);background:#fff}
.matrix-grid input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.multiline-wrap{background:#fafbfe;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.multiline-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.multiline-row input{flex:1;border:1.5px solid var(--line2);border-radius:8px;padding:9px 11px;
font-size:14px;font-family:var(--fm);outline:none;background:#fff}
.multiline-row .rm{border:none;background:#f2f3f9;width:36px;height:36px;border-radius:7px;cursor:pointer;
font-size:14px;color:var(--ink2);flex-shrink:0}
.multiline-add{border:1.5px dashed var(--line2);background:transparent;padding:10px 14px;border-radius:8px;
cursor:pointer;font-size:13px;color:var(--ink2);width:100%}
.multiline-add:hover{border-color:var(--brand);color:var(--brand);background:var(--soft)}
/* 便签再分句对话框 */
.split-preview{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;
background:#fafbfe;padding:6px;-webkit-overflow-scrolling:touch}
.split-item{padding:10px 12px;border-radius:8px;background:#fff;margin-bottom:4px;border:1px solid var(--line)}
.split-item .si-idx{font-family:var(--fc);font-size:11.5px;color:var(--brand);font-weight:700;margin-bottom:3px}

<script>
/* ================================================================
   工具
   ================================================================ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
function toast(msg,ms=2200,act){
  const t=$('#toast');t.innerHTML='';
  const sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);
  clearTimeout(t._t);
  if(act){const b=document.createElement('button');b.textContent=act.label;
    b.onclick=()=>{t.classList.remove('on');clearTimeout(t._t);act.onClick()};t.appendChild(b);}
  t.classList.add('on');
  t._t=setTimeout(()=>t.classList.remove('on'),ms);
}

/* ================================================================
   分类选择器
   ================================================================ */
function buildCatOptions(cats, counts){
  const all=new Set();
  cats.forEach(c=>{
    if(!c)return;
    const parts=c.split('/').filter(Boolean);
    let path='';
    for(const p of parts){path=path?path+'/'+p:p;all.add(path);}
  });
  const arr=[...all].sort((a,b)=>{
    const pa=a.split('/'),pb=b.split('/');
    for(let i=0;i<Math.min(pa.length,pb.length);i++){if(pa[i]!==pb[i])return pa[i].localeCompare(pb[i],'zh')}
    return pa.length-pb.length;
  });
  return arr.map(path=>{
    const parts=path.split('/');
    const depth=parts.length-1;
    return {path,label:'　'.repeat(depth)+(depth>0?'└ ':'')+parts[parts.length-1],count:counts?counts[path]||0:0,depth};
  });
}
function initCatPicker(container,opts){
  const {initial='',options=[],allowNew=true,onChange}=opts;
  const input=container.querySelector('.cp-input');
  const drop=container.querySelector('.cp-drop');
  let currentValue=initial;
  input.value=initial;
  const render=(filter)=>{
    const f=(filter||'').toLowerCase().trim();
    let list=options;
    if(f)list=options.filter(o=>o.path.toLowerCase().includes(f)||o.label.toLowerCase().includes(f));
    let html='';
    if(!list.length&&!f)html='<div class="cp-empty">还没有分类</div>';
    else{
      html=list.map(o=>{
        const active=o.path===currentValue?' active':'';
        const cnt=o.count?'<span class="cp-cnt">'+o.count+'</span>':'';
        return `<div class="cp-item${active}" data-v="${esc(o.path)}"><span class="cp-path">${esc(o.label)}</span>${cnt}</div>`;
      }).join('');
      if(allowNew&&f&&!options.some(o=>o.path.toLowerCase()===f)){
        html+=`<div class="cp-item cp-new" data-v="${esc(filter)}">新建「${esc(filter)}」</div>`;
      }
    }
    drop.innerHTML=html;
    drop.querySelectorAll('.cp-item').forEach(el=>{
      el.onmousedown=el.ontouchstart=(e)=>{
        e.preventDefault();
        currentValue=el.dataset.v;
        input.value=currentValue;
        drop.classList.remove('open');
        if(onChange)onChange(currentValue);
      };
    });
  };
  input.addEventListener('focus',()=>{render(input.value===currentValue?'':input.value);drop.classList.add('open')});
  input.addEventListener('input',()=>{render(input.value);drop.classList.add('open')});
  input.addEventListener('blur',()=>{
    setTimeout(()=>{
      drop.classList.remove('open');
      const v=input.value.trim();
      if(v!==currentValue){currentValue=v;if(onChange)onChange(currentValue);}
    },200);
  });
  input.addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){e.preventDefault();const v=input.value.trim();
      if(v){currentValue=v;drop.classList.remove('open');if(onChange)onChange(v);}}
    else if(e.key==='Escape'){drop.classList.remove('open');input.blur();}
  });
  return {getValue(){return input.value.trim()},setValue(v){input.value=v||'';currentValue=v||'';}};
}

function migrateOldData(){
  const keys=['notes','memos','categories','essays','symbols','quick','noteCats'];
  const prefixes=['cry.','cry.cry.','cry.user.','mathnote.','cry.note.','cry.data.'];
  for(const k of keys){
    const newKey='cry.cry.'+k;
    if(localStorage.getItem(newKey))continue;
    for(const pre of prefixes){
      const oldKey=pre+k;
      if(oldKey===newKey)continue;
      const oldVal=localStorage.getItem(oldKey);
      if(oldVal){try{JSON.parse(oldVal);localStorage.setItem(newKey,oldVal);break}catch(e){}}
    }
  }
}

const MT={
  SYM:{
    alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ε',varepsilon:'ε',zeta:'ζ',eta:'η',
    theta:'θ',vartheta:'ϑ',iota:'ι',kappa:'κ',lambda:'λ',mu:'μ',nu:'ν',xi:'ξ',pi:'π',
    varpi:'ϖ',rho:'ρ',varrho:'ϱ',sigma:'σ',varsigma:'ς',tau:'τ',upsilon:'υ',
    phi:'φ',varphi:'ϕ',chi:'χ',psi:'ψ',omega:'ω',
    Gamma:'Γ',Delta:'Δ',Theta:'Θ',Lambda:'Λ',Xi:'Ξ',Pi:'Π',Sigma:'Σ',
    Upsilon:'Υ',Phi:'Φ',Psi:'Ψ',Omega:'Ω',
    times:'×',div:'÷',pm:'±',mp:'∓',cdot:'·',ast:'∗',star:'⋆',circ:'∘',bullet:'•',
    oplus:'⊕',ominus:'⊖',otimes:'⊗',oslash:'⊘',odot:'⊙',
    leq:'≤',le:'≤',geq:'≥',ge:'≥',neq:'≠',ne:'≠',equiv:'≡',approx:'≈',cong:'≅',simeq:'≃',
    propto:'∝',sim:'∼',nsim:'≁',ll:'≪',gg:'≫',
    in:'∈',notin:'∉',ni:'∋',subset:'⊂',supset:'⊃',subseteq:'⊆',supseteq:'⊇',
    nsubseteq:'⊈',nsupseteq:'⊉',cup:'∪',cap:'∩',emptyset:'∅',varnothing:'∅',
    setminus:'∖',complement:'∁',
    forall:'∀',exists:'∃',nexists:'∄',neg:'¬',lnot:'¬',land:'∧',wedge:'∧',lor:'∨',vee:'∨',
    therefore:'∴',because:'∵',
    to:'→',rightarrow:'→',leftarrow:'←',leftrightarrow:'↔',Rightarrow:'⇒',Leftarrow:'⇐',
    Leftrightarrow:'⇔',mapsto:'↦',longrightarrow:'⟶',longleftarrow:'⟵',
    uparrow:'↑',downarrow:'↓',updownarrow:'↕',nearrow:'↗',searrow:'↘',
    implies:'⟹',impliedby:'⟸',iff:'⟺',
    infty:'∞',partial:'∂',nabla:'∇',
    ldots:'…',cdots:'⋯',vdots:'⋮',ddots:'⋱',
    prime:'′',angle:'∠',triangle:'△',square:'□',blacksquare:'■',
    langle:'⟨',rangle:'⟩',lceil:'⌈',rceil:'⌉',lfloor:'⌊',rfloor:'⌋',
    vert:'|',Vert:'‖',mid:'|',degree:'°',ell:'ℓ',hbar:'ℏ',Re:'ℜ',Im:'ℑ',aleph:'ℵ'
  },
  FUNCS:['sin','cos','tan','cot','sec','csc','arcsin','arccos','arctan',
    'sinh','cosh','tanh','log','ln','lg','exp','gcd','lcm','min','max','lim','sup','inf'],
  BIGOPS:['sum','prod','coprod','int','iint','iiint','oint'],
  LIMOPS:['lim','max','min','sup','inf'],
  matchBrace(s,start){
    if(s[start]!=='{')return null;
    let depth=0,i=start;
    while(i<s.length){
      if(s[i]==='{')depth++;
      else if(s[i]==='}'){depth--;if(depth===0)return{content:s.slice(start+1,i),end:i+1}}
      i++;
    }
    return null;
  },
  matchToken(s,start){
    if(start>=s.length)return null;
    if(s[start]==='{')return this.matchBrace(s,start);
    if(s[start]==='\\'){
      let i=start+1,name='';
      while(i<s.length&&/[a-zA-Z]/.test(s[i])){name+=s[i];i++;}
      if(name)return{content:'\\'+name,end:i,isCmd:true};
      return{content:s[start]+(s[start+1]||''),end:start+2,isCmd:true};
    }
    return{content:s[start],end:start+1};
  },
  renderPart(str){
    if(!str)return '';
    if(/^\\[a-zA-Z]+$/.test(str)){
      const name=str.slice(1);
      if(this.FUNCS.includes(name))return `<span class="mt-op">${name}</span>`;
      return this.SYM[name]!==undefined?esc(this.SYM[name]):esc(str);
    }
    return this.parse(str);
  },
  renderFrac(a,b){
    return `<span class="mt-frac"><span class="mt-num">${this.renderPart(a)}</span><span class="mt-den">${this.renderPart(b)}</span></span>`;
  },
  renderSqrt(rad,n){
    const inner=this.renderPart(rad);
    if(n&&n!=='2'&&n!==''){return `<span class="mt-sqrt"><span class="mt-root">${this.parse(n)}</span><span class="mt-rad">√</span><span class="mt-radicand">${inner}</span></span>`}
    return `<span class="mt-sqrt"><span class="mt-rad">√</span><span class="mt-radicand">${inner}</span></span>`;
  },
  renderBigop(name,sub,sup){
    const op=this.SYM[name]||name;
    if(this.LIMOPS.includes(name)){
      const subH=sub?`<span class="mt-limsub">${this.renderPart(sub)}</span>`:'';
      return `<span class="mt-limo"><span class="mt-limname">${op}</span>${subH}</span>`;
    }
    const subH=sub?this.renderPart(sub):'';
    const supH=sup?this.renderPart(sup):'';
    return `<span class="mt-bigop"><span class="mt-bigsup">${supH}</span><span class="mt-bigop-sym">${op}</span><span class="mt-bigsub">${subH}</span></span>`;
  },
  renderEnv(env,body){
    const rows=body.split(/\\\\/).map(r=>r.trim()).filter(Boolean);
    if(env==='cases'){
      const rowsH=rows.map(r=>`<div class="mt-case-row">${this.parse(r.replace(/&/g,' ').trim())}</div>`).join('');
      return `<span class="mt-cases"><span class="mt-mleft" style="font-size:2.1em;transform:scaleY(1.35)">{</span><div class="mt-cases-body">${rowsH}</div></span>`;
    }
    const lmap={pmatrix:'(',bmatrix:'[',vmatrix:'|',Bmatrix:'{',matrix:''};
    const rmap={pmatrix:')',bmatrix:']',vmatrix:'|',Bmatrix:'}',matrix:''};
    const left=lmap[env]||'',right=rmap[env]||'';
    const rowsH=rows.map(r=>{
      const cells=r.split('&').map(c=>`<td>${this.parse(c.trim())}</td>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<span class="mt-matrix"><span class="mt-mleft">${left}</span><table class="mt-mtable"><tbody>${rowsH}</tbody></table><span class="mt-mright">${right}</span></span>`;
  },
  parse(s){
    let out='',i=0;
    while(i<s.length){
      const ch=s[i];
      if(s.slice(i,i+6)==='\\begin'){
        const m=s.slice(i).match(/^\\begin\{(\w+)\}/);
        if(m){
          const env=m[1],endTag='\\end{'+env+'}';
          const endIdx=s.indexOf(endTag,i+m[0].length);
          if(endIdx>-1){
            const body=s.slice(i+m[0].length,endIdx);
            out+=this.renderEnv(env,body);
            i=endIdx+endTag.length;continue;
          }
        }
      }
      if(s.slice(i,i+5)==='\\frac'){
        const a=this.matchToken(s,i+5);
        if(a){const b=this.matchToken(s,a.end);if(b){out+=this.renderFrac(a.content,b.content);i=b.end;continue}}
      }
      if(s.slice(i,i+5)==='\\sqrt'){
        let n='',pos=i+5;
        if(s[pos]==='['){const close=s.indexOf(']',pos);if(close>-1){n=s.slice(pos+1,close);pos=close+1}}
        const rad=this.matchToken(s,pos);
        if(rad){out+=this.renderSqrt(rad.content,n);i=rad.end;continue}
      }
      if(s.slice(i,i+5)==='\\left'){
        const tk=this.matchToken(s,i+5);
        if(tk){
          const lc=this.SYM[tk.content.slice(1)]||tk.content.slice(1)||'';
          out+=esc(lc);i=tk.end;
          const ri=s.indexOf('\\right',i);
          if(ri>-1){
            const rt=this.matchToken(s,ri+6);
            if(rt){
              out+=this.parse(s.slice(i,ri));
              const rc=this.SYM[rt.content.slice(1)]||rt.content.slice(1)||'';
              out+=esc(rc);i=rt.end;continue;
            }
          }
        }
      }
      if(ch==='\\'){
        const m=s.slice(i).match(/^\\([a-zA-Z]+)/);
        if(m){
          const name=m[1];
          if(name==='text'||name==='mathrm'||name==='operatorname'){
            const g=this.matchToken(s,i+m[0].length);
            if(g){out+=`<span class="mt-text">${esc(g.content)}</span>`;i=g.end;continue}
          }
          if(name==='tag'){const g=this.matchToken(s,i+m[0].length);if(g){i=g.end;continue}}
          if([...this.BIGOPS,...this.LIMOPS].includes(name)){
            let pos=i+m[0].length,sub='',sup='',loop=true;
            while(loop&&pos<s.length){
              if(s[pos]==='_'){const tk=this.matchToken(s,pos+1);if(tk){sub=tk.content;pos=tk.end;continue}}
              if(s[pos]==='^'){const tk=this.matchToken(s,pos+1);if(tk){sup=tk.content;pos=tk.end;continue}}
              loop=false;
            }
            out+=this.renderBigop(name,sub,sup);i=pos;continue;
          }
          if(this.FUNCS.includes(name)){out+=`<span class="mt-op">${name}</span>`;i+=m[0].length;continue}
          if(this.SYM[name]!==undefined){out+=esc(this.SYM[name]);i+=m[0].length;continue}
          out+=esc(m[0]);i+=m[0].length;continue;
        }
        const c=s[i+1];
        if(c==='{'||c==='}'||c==='|'){out+=esc(c);i+=2;continue}
        if(c==='\\'){out+='<br>';i+=2;continue}
        if(c===','){out+='<span class="mt-thin"></span>';i+=2;continue}
        if(c===';'){out+='<span class="mt-thin" style="width:.3em"></span>';i+=2;continue}
        if(c===' '){out+=' ';i+=2;continue}
        out+=esc(c||'\\');i+=2;continue;
      }
      if(ch==='^'||ch==='_'){
        const tk=this.matchToken(s,i+1);
        if(tk){
          const inner=this.renderPart(tk.content);
          out+=ch==='^'?`<sup>${inner}</sup>`:`<sub>${inner}</sub>`;
          i=tk.end;continue;
        }
      }
      if(ch==='{'){const g=this.matchBrace(s,i);if(g){out+=this.parse(g.content);i=g.end;continue}}
      if(ch==='}'){i++;continue}
      if(ch===' '){out+='&nbsp;'}
      else if(ch==='&'){out+='&amp;'}
      else if(ch==='<'){out+='&lt;'}
      else if(ch==='>'){out+='&gt;'}
      else out+=esc(ch);
      i++;
    }
    return out;
  },
  render(tex,display){
    try{return `<span class="mt${display?' mt-disp':''}">${this.parse(String(tex).trim())}</span>`}
    catch(e){return `<span class="mt-err">${esc(tex)}</span>`}
  }
};

const SmartSplit={
ABBR:new Set(['mr','mrs','ms','dr','prof','st','jr','sr','vs','etc','e.g','i.e','a.m','p.m',
  'u.s','u.k','u.s.a','no','fig','vol','ch','sec','eq','ref','cf','al',
  'inc','ltd','co','corp','dept','univ','ave','blvd','rd','mt','ft','approx',
  'eg','ie','am','pm','us','uk','usa','ph.d','b.a','m.a','b.s','m.s','d.c']),
_clean(s){return String(s||'').replace(/^[\s—–―─\-]+/,'').replace(/[。，,.;；、\s]+$/,'').trim()},
isSourceLine(line,allowName){
  const t=String(line||'').trim();
  if(!t)return false;
  if(t.length>50)return false;
  if(/[：:]\s*$/.test(t))return true;
  if(/^[—–―─]{1,3}\s*\S.{0,40}$/.test(t))return true;
  if(/^[【\[［]\s*.{1,40}\s*[】\]］]$/.test(t))return true;
  if(/^[《「『"].{1,40}[》」』"]$/.test(t))return true;
  if(/^[（(]\s*.{1,40}\s*[）)]$/.test(t))return true;
  if(/^(出自|引自|见于|参见|摘自|选自|语出|源|source|via)\s*[:：]/i.test(t))return true;
  if(allowName&&/^[\u4e00-\u9fff·]{2,5}$/.test(t))return true;
  if(allowName&&/^[A-Z][A-Za-z\s.'-]{2,40}$/.test(t)&&t.split(/\s+/).length<=5)return true;
  return false;
},
extractSourceLine(line){
  let t=String(line||'').trim();
  let m=t.match(/^[【\[［]\s*(.+?)\s*[】\]］]$/);if(m)return this._clean(m[1]);
  m=t.match(/^[（(]\s*(.+?)\s*[）)]$/);if(m)return this._clean(m[1]);
  m=t.match(/^[「『"']\s*(.+?)\s*[」』"']$/);if(m)return this._clean(m[1]);
  m=t.match(/^(出自|引自|见于|参见|摘自|选自|语出|源|source|via)\s*[:：]?\s*(.+)$/i);if(m)return this._clean(m[2]);
  t=t.replace(/[：:]\s*$/,'').trim();
  t=t.replace(/^[—–―─]{1,3}\s*/,'').trim();
  return this._clean(t);
},
src(raw){
  let t=String(raw||'').trim(),s='';
  if(!t)return{text:'',source:''};
  const cl=x=>this._clean(x);
  let m=t.match(/[\s]*[—–―─]{2,}\s*([^—–―─\n]{1,80})\s*$/);
  if(m){const v=cl(m[1]);if(v)return{text:t.slice(0,m.index).trim(),source:v}}
  m=t.match(/[\s]+[-–—]\s*([A-Z][A-Za-z0-9\s.''\-]{2,60})\s*$/);
  if(m)return{text:t.slice(0,m.index).trim(),source:cl(m[1])};
  m=t.match(/[\s，,。.;；、]*(出自|引自|见于|参见|摘自|选自|语出|源|source|via)\s*[:：]?\s*[《【「『"']?\s*([^》】」』"'\]]{1,80})\s*[》】」』"'\]]?\s*$/i);
  if(m)return{text:t.slice(0,m.index).trim(),source:cl(m[2])};
  m=t.match(/[（(]\s*([^）)]{1,80})\s*[）)]\s*$/);
  if(m){const inner=cl(m[1]);if(inner&&!/[。！？.!?]/.test(inner))return{text:t.slice(0,m.index).trim(),source:inner}}
  m=t.match(/^[【\[［]\s*([^】\]］]{1,80})\s*[】\]］]\s*/);
  if(m)return{text:t.slice(m[0].length).trim(),source:cl(m[1])};
  m=t.match(/^[「『"']\s*([^」』"']{1,80})\s*[」』"']\s*[：:，,]\s*/);
  if(m)return{text:t.slice(m[0].length).trim(),source:cl(m[1])};
  m=t.match(/^([^\n：:]{1,25})[：:]\s*(\S.+)$/);
  if(m){
    const head=m[1].trim();
    const ok=(/《|》|「|」|『|』/.test(head)||/(说|写道|言|曰|著|作品|文集|诗集|散文集|语录)$/.test(head)||/^[\u4e00-\u9fff·]{2,10}$/.test(head));
    if(ok)return{text:m[2].trim(),source:cl(head)};
  }
  return{text:t,source:s};
},
_isLatin(c){return /[a-zA-Z0-9]/.test(c)},
_isCJK(c){return /[\u4e00-\u9fff\u3400-\u4dbf]/.test(c)},
sents(block){
  const text=block.replace(/\s+/g,' ').trim();
  if(!text)return[];
  const isTail=c=>/["'”’」』】）)\]〞〟]/.test(c);
  const out=[];let buf='';
  for(let i=0;i<text.length;i++){
    const ch=text[i];buf+=ch;let cut=false;
    if('。！？…'.includes(ch)){
      const nx=text[i+1]||'';
      if(!/[。！？…!?]/.test(nx)){if(this._isLatin(nx))cut=false;else cut=true}
    }else if(ch==='!'||ch==='?'){
      const nx=text[i+1]||'';
      if(!/[。！？…!?]/.test(nx))cut=true;
    }else if(ch==='.'){
      const pv=text[i-1]||'',nx=text[i+1]||'';
      if(/\d/.test(pv)&&/\d/.test(nx))cut=false;
      else if(/[a-zA-Z]/.test(nx))cut=false;
      else if(nx==='.')cut=false;
      else{
        const before=buf.slice(0,-1).trim();
        const wm=before.match(/([a-zA-Z][a-zA-Z.]*)$/);
        const w=wm?wm[1].toLowerCase():'';
        if(this.ABBR.has(w))cut=false;
        else if(this.ABBR.has(w.replace(/\./g,'')))cut=false;
        else{
          const nns=text.slice(i+1).replace(/^\s+/,'')[0]||'';
          if(this._isCJK(nns))cut=false;else cut=true;
        }
      }
    }
    if(cut){
      while(i+1<text.length&&isTail(text[i+1])){buf+=text[i+1];i++}
      const s=buf.trim();if(s)out.push(s);buf='';
      while(i+1<text.length&&/\s/.test(text[i+1]))i++;
    }
  }
  if(buf.trim())out.push(buf.trim());
  return out.filter(s=>s.length>0);
},
split(raw,mode='sentence'){
  const out=[];
  if(mode==='line'){raw.split(/\r?\n/).forEach(l=>{const t=l.trim();if(!t)return;const r=this.src(t);if(r.text)out.push(r)});return out}
  if(mode==='para'){raw.split(/\n\s*\n/).forEach(p=>{const t=p.replace(/\s+/g,' ').trim();if(!t)return;const r=this.src(t);if(r.text)out.push(r)});return out}
  const lines=raw.split(/\r?\n/);
  let curSource='',buffer='',prevEmpty=true;
  const flushBuffer=()=>{
    if(!buffer.trim())return;
    const r=this.src(buffer.trim());
    const main=r.text,source=r.source;
    if(!main){buffer='';return}
    const sents=this.sents(main);
    const finalSource=source||curSource;
    if(!sents.length)out.push({text:main,source:finalSource});
    else if(sents.length===1)out.push({text:sents[0],source:finalSource});
    else sents.forEach((s,i)=>out.push({text:s,source:i===sents.length-1?finalSource:curSource}));
    buffer='';
  };
  for(let li=0;li<lines.length;li++){
    const t=lines[li].trim();
    if(!t){flushBuffer();curSource='';prevEmpty=true;continue}
    if(this.isSourceLine(t,prevEmpty||li===0)){curSource=this.extractSourceLine(t);flushBuffer();prevEmpty=false;continue}
    buffer=buffer?buffer+' '+t:t;prevEmpty=false;
  }
  flushBuffer();
  return out;
}
};

const Cat={
all:[],cur:'',
save(){Store.set('cats',this.all)},
load(){this.all=Store.get('cats',['未分类'])},
countMap(){const cnt={};for(const m of Memo.all){const c=m.category||'未分类';cnt[c]=(cnt[c]||0)+1}return cnt},
tree(){
  const t={};
  for(const p of this.all){
    const parts=p.split('/').filter(Boolean);
    let cur=t,path='';
    for(let i=0;i<parts.length;i++){
      path=path?path+'/'+parts[i]:parts[i];
      if(!cur[parts[i]])cur[parts[i]]={_path:path,_children:{},_cnt:0};
      cur=cur[parts[i]]._children;
    }
  }
  for(const m of Memo.all){
    const parts=(m.category||'未分类').split('/').filter(Boolean);
    let cur=t;
    for(const part of parts){if(cur[part]){cur[part]._cnt++;cur=cur[part]._children}}
  }
  return t;
},
render(){
  const tree=this.tree();
  const box=$('#memoTree');
  const renderNode=(name,node,lv)=>{
    const path=node._path;
    const hasChild=Object.keys(node._children).length>0;
    const isActive=path===this.cur;
    const open=isActive||lv<=1;
    const cls='tree-node'+(isActive?' active':'')+' lv'+Math.min(lv+1,4)+(open?' open':'');
    let html=`<div class="${cls}" data-path="${esc(path)}">`;
    html+=`<span class="ico">${hasChild?(open?'▼':'▶'):' '}</span>`;
    html+=`<span class="nm">${esc(name)}</span>`;
    html+=`<span class="cnt">${node._cnt}</span></div>`;
    if(hasChild){
      html+=`<div class="tree-children" style="${open?'':'display:none'}">`;
      for(const k in node._children)html+=renderNode(k,node._children[k],lv+1);
      html+=`</div>`;
    }
    return html;
  };
  let html=`<div class="tree-node lv1 ${this.cur===''?'active':''}" data-path="">
<span class="ico">📂</span><span class="nm">全部便签</span>
<span class="cnt">${Memo.all.length}</span></div>`;
  for(const k in tree)html+=renderNode(k,tree[k],0);
  box.innerHTML=html;
  box.querySelectorAll('.tree-node').forEach(node=>{
    node.onclick=e=>{
      e.stopPropagation();
      const path=node.dataset.path;
      const hasChildren=node.nextElementSibling&&node.nextElementSibling.classList.contains('tree-children');
      if(hasChildren){
        const ch=node.nextElementSibling;
        const visible=ch.style.display!=='none';
        ch.style.display=visible?'none':'';
        node.classList.toggle('open',!visible);
        node.querySelector('.ico').textContent=visible?'▶':'▼';
      }
      if(path!==this.cur){this.cur=path;this.render();Memo.render()}
    };
    node.addEventListener('dragover',e=>{
      if(!Memo.dragId&&(!Memo.dragIds||!Memo.dragIds.length))return;
      e.preventDefault();e.dataTransfer.dropEffect='move';
      node.classList.add('drag-target');
    });
    node.addEventListener('dragleave',()=>node.classList.remove('drag-target'));
    node.addEventListener('drop',e=>{
      e.preventDefault();node.classList.remove('drag-target');
      let ids=Memo.dragIds&&Memo.dragIds.length?Memo.dragIds:[];
      try{const dt=e.dataTransfer.getData('text/plain');
        if(dt){if(dt.startsWith('[')){const arr=JSON.parse(dt);if(Array.isArray(arr)&&arr.length)ids=arr}else{ids=[dt]}}
      }catch(err){}
      if(!ids.length&&Memo.dragId)ids=[Memo.dragId];
      if(!ids.length)return;
      const newCat=node.dataset.path||'未分类';
      const moving=[];
      ids.forEach(id=>{const m=Memo.all.find(x=>x.id===id);if(m&&(m.category||'未分类')!==newCat)moving.push(m)});
      if(!moving.length){toast('已经在该分类中');return}
      moving.forEach(m=>{m.category=newCat;m.updated=now()});
      Memo.save();
      if(newCat!=='未分类'&&!Cat.all.includes(newCat)){Cat.all.push(newCat);Cat.save()}
      Memo.sel.clear();
      Memo.render();Cat.render();Memo.updSel();
      toast(moving.length>1?`已移动 ${moving.length} 条到「${newCat}」`:`已移动到「${newCat}」`);
    });
  });
}
};

splitOne(id){
  const m=this.all.find(x=>x.id===id);if(!m)return;
  let curMode='sentence';

    try{

        const parts=SmartSplit.sents(m.text);
        pieces=parts.map(t=>({text:t,source:m.source||''}));
      }else if(curMode==='line'){
        pieces=m.text.split(/\r?\n/).map(t=>t.trim()).filter(Boolean).map(t=>({text:t,source:m.source||''}));
      }else{
        pieces=SmartSplit.split(m.text,'para').map(p=>({text:p.text,source:p.source||m.source||''}));
      }
    }catch(e){pieces=[]}
    renderPv();
  };
  const renderPv=()=>{
    const box=$('#spList');if(!box)return;
    if(!pieces.length){
      box.innerHTML='<div class="pv-empty">没有可分割的内容</div>';

  };

</div>`,b=>{
    b.querySelectorAll('input[name=spm]').forEach(r=>{
      r.onchange=()=>{curMode=r.value;rebuild()};
    });
    b.querySelector('#spOk').onclick=()=>{
      if(pieces.length<=1){toast('只有一条，无需分割');return}

      const idx=this.all.findIndex(x=>x.id===id);

        (currentPieces.length>50?`<div class="pv-more">…还有 ${currentPieces.length-50} 条…</div>`:'');
    };

    const rebuild=()=>{
      const raw=ta.value;

      catch(e){toast('分割失败：'+e.message)}
    };

    ta.addEventListener('input',()=>{clearTimeout(debTimer);debTimer=setTimeout(rebuild,300)});
    modeRadios.forEach(r=>{r.addEventListener('change',()=>{currentMode=r.value;rebuild()})});

    fileI.onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=ev=>{ta.value=ev.target.result;rebuild()};
      r.onerror=()=>toast('文件读取失败');
      r.readAsText(f,'UTF-8');
    };

    b.querySelector('#ok').onclick=()=>{
      if(!currentPieces.length){toast('请先输入文本');return}
      const cat=picker.getValue().trim()||'未分类';
      if(!Cat.all.includes(cat)){Cat.all.push(cat);Cat.save()}

      toast(`已生成 ${currentPieces.length} 张便签`+(ws?`，识别出处 ${ws} 条`:''));
    };

    renderPreview();
    setTimeout(()=>ta.focus(),200);
  });
},

   自动排版
   ================================================================ */
function autoFormatText(text){
  const lines=text.split(/\r?\n/);const out=[];let buf='';
  const boxKw=[
    {re:/^定\s*义[:：]?\s*/,cls:'def'},{re:/^定\s*理[:：]?\s*/,cls:'thm'},
    {re:/^引\s*理[:：]?\s*/,cls:'lem'},{re:/^推\s*论[:：]?\s*/,cls:'cor'},
    {re:/^例\s*\d*[:：]?\s*/,cls:'ex'},{re:/^解[:：]?\s*/,cls:'sol'},
    {re:/^证\s*明[:：]?\s*/,cls:'prf'},{re:/^注\s*意[:：]?\s*/,cls:'note'},
    {re:/^小\s*结[:：]?\s*/,cls:'sum'},
    {re:/^Problem\s*[:：]?/i,cls:'prob'},
    {re:/^Solution\s*[:：]?/i,cls:'sln'},
    {re:/^Remark\s*[:：]?/i,cls:'rmk'},
    {re:/^Source\s*[:：]?/i,cls:'ref'}
  ];
  const flush=()=>{
    if(!buf.trim())return;
    const t=buf.trim();let done=false;
    for(const k of boxKw){if(k.re.test(t)){out.push(`<div class="mbox ${k.cls}">${esc(t)}</div>`);done=true;break}}
    if(!done){
      if(t.length<40&&!/[。！？.!?]/.test(t))out.push(`<h3>${esc(t)}</h3>`);
      else out.push(`<p>${esc(t)}</p>`);
    }
    buf='';
  };
  for(const line of lines){
    const trimmed=line.trim();
    if(!trimmed){flush();continue}
    const isKw=boxKw.some(k=>k.re.test(trimmed));
    if(isKw){flush();buf=trimmed}
    else if(buf)buf+=' '+trimmed;
    else buf=trimmed;
  }
  flush();
  return out.join('');
}

renderOutline(){

  this.ed.querySelectorAll('h1,h2,h3,.mbox').forEach((el,i)=>{
    let label='',level=0,icon='';
    const tag=el.tagName.toLowerCase();
    if(tag==='h1'){h1c++;h2c=0;h3c=0;level=1;label=el.textContent.trim().slice(0,50);icon='§'+h1c}
    else if(tag==='h2'){h2c++;h3c=0;level=2;label=el.textContent.trim().slice(0,50);icon=h1c+'.'+h2c}
    else if(tag==='h3'){h3c++;level=3;label=el.textContent.trim().slice(0,50);icon=h1c+'.'+h2c+'.'+h3c}
    else if(el.classList.contains('mbox')){
      level=4;
      const nameMap={def:'定义',thm:'定理',lem:'引理',cor:'推论',ex:'例',sol:'解',
        prf:'证明',note:'注意',sum:'小结',prob:'问题',sln:'解答',rmk:'备注',ref:'来源'};
      const cls=[...el.classList].find(c=>nameMap[c]);
      icon='◆';
      const text=el.textContent.replace(/\s+/g,' ').trim();
      label=(nameMap[cls]||'框')+(text?' · '+text.slice(0,30):'');
    }
    if(label){el.id='ol-'+i;items.push({level,label,icon,id:el.id})}

    box.innerHTML='<div class="ol-empty">还没有标题或框<br>用「标题 1/2/3」创建章节</div>';

  box.querySelectorAll('.ol-item').forEach(el=>{
    el.onclick=()=>{
      const t=document.getElementById(el.dataset.target);
      if(t){
        t.scrollIntoView({behavior:'smooth',block:'center'});

        t.style.background='#fff8d6';
        setTimeout(()=>{t.style.background=oldBg||'';t.style.transition=''},1200);
      }
    };
  });
},

        e.preventDefault();
        const items=this.slashMenuEl.querySelectorAll('.sm-item');
        const cur=[...items].findIndex(it=>it.classList.contains('active'));
        let next=cur;
        if(e.key==='ArrowDown')next=(cur+1)%items.length;
        else next=(cur-1+items.length)%items.length;
        items.forEach(it=>it.classList.remove('active'));
        items[next].classList.add('active');

      if(e.key==='Enter'||e.key==='Tab'){
        const act=this.slashMenuEl.querySelector('.sm-item.active');

      }
    }
    if(e.key==='/'){setTimeout(()=>this.openSlashMenu(),10)}
  });
  this.ed.addEventListener('input',()=>{
    if(!this.slashMenuEl&&this.ed.textContent.endsWith('/'))this.openSlashMenu();
